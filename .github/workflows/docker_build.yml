name: CI to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docker_build.yml
      - 'ComWeChatRobot/**'
      - 'wine/**'
      - 'Dockerfile'
      - 'VERSION'
      - 'run_*.py'
      - 'WeChatHook.exe'
  workflow_dispatch:
    inputs:
      is_release:
        description: '是否发布为正式版（勾选后覆盖 latest 并打版本号，默认不覆盖）'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Determine Docker Tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="$(cat VERSION)"
          IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/docker-com_wechat_robot"
          IS_RELEASE="${{ inputs.is_release }}"
          echo "Is Release: ${IS_RELEASE}"

          if [ "${IS_RELEASE}" = "true" ]; then
            echo "Release build: tags include latest, version, and commit sha."
            {
              echo "TAGS<<EOF"
              echo "${IMAGE}:latest"
              echo "${IMAGE}:${VERSION}"
              echo "${IMAGE}:${SHORT_SHA}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          else
            echo "Dev/Push build: tag only commit sha."
            {
              echo "TAGS<<EOF"
              echo "${IMAGE}:${SHORT_SHA}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: ${{ steps.meta.outputs.TAGS }}
          labels: |
            maintainer=${{ github.event.head_commit.author.email }}
            timestamp=${{ github.event.head_commit.timestamp }}
            message=${{ github.event.head_commit.message }}
            commit=${{ github.event.head_commit.url }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
